apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rosterra.fullname" . }}-secrets
  labels:
    {{- include "rosterra.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-seed: {{ .Values.secrets.jwtSeed | quote }}
  postgres-dsn: {{ printf "postgres://%s:%s@%s:%d/%s?sslmode=disable" .Values.infra.postgresUser .Values.infra.postgresPassword .Values.infra.postgresHost (int .Values.infra.postgresPort) .Values.infra.postgresDb | quote }}
