apiVersion: v1
kind: Service
metadata:
  name: {{ include "rosterra.component" (dict "ctx" . "component" "auth") }}
  labels:
    {{- include "rosterra.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  selector:
    {{- include "rosterra.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: auth
  ports:
    - name: http
      port: {{ .Values.auth.httpPort }}
      targetPort: http
    - name: grpc
      port: {{ .Values.auth.grpcPort }}
      targetPort: grpc
