// Контракт межсервисного gRPC users-service.
// Профили создаёт users-service по событию/вызову от auth-service (user.created).
// Генерация: buf generate (см. buf.gen.yaml) → services/users/gen.
syntax = "proto3";

package users.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/rosterra/services/users/gen/users/v1;usersv1";

// Profile — профиль пользователя. Владелец данных — users-service.
// user_id совпадает с id пользователя в auth-service.
message Profile {
  string user_id = 1;
  string display_name = 2;
  string avatar_url = 3;
  string notes = 4; // служебные заметки (только admin)
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CreateProfileRequest {
  string user_id = 1;
  string display_name = 2;
  string avatar_url = 3;
}

message CreateProfileResponse {
  Profile profile = 1;
}

message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  Profile profile = 1;
}

message UpdateProfileRequest {
  string user_id = 1;
  string display_name = 2;
  string avatar_url = 3;
  string notes = 4;
}

message UpdateProfileResponse {
  Profile profile = 1;
}

// UsersService — синхронные межсервисные операции с профилями.
service UsersService {
  // CreateProfile вызывается auth-service при регистрации (user.created).
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
}
