name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TS — lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Unit tests
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

  go:
    name: Go — lint / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Build, vet, test (per module)
        # Из корня go.work паттерн ./... не работает — проверяем каждый модуль явно.
        # Добавляйте новые сервисы в этот список.
        run: |
          set -e
          for m in pkg services/auth services/users; do
            echo "== $m =="
            (cd "$m" && go build ./... && go vet ./... && go test ./...)
          done

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
